<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>投稿ページ</title>
<style>
  :root {
    --bg: #f6f8f5; --card: #ffffff; --ink: #1d2a22; --sub: #5d6b62; --line: #dbe3dc;
    --main: #2f6f4f; --main-ink: #ffffff; --ig: #c13584;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121815; --card: #1b241f; --ink: #e8efe9; --sub: #9db0a3; --line: #2b3a31; --main: #5fb283; --main-ink: #0d1a12; --ig: #e0609f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .media { display: grid; gap: 10px; }
  .media video, .media img { width: 100%; max-height: 62vh; object-fit: contain; border-radius: 12px; background: #000; display: block; }
  .cap-title { font-size: 14px; color: var(--sub); margin: 0 0 6px; }
  pre#caption { white-space: pre-wrap; word-break: break-word; margin: 0; font: inherit; font-size: 16px; }
  button, a.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    min-height: 56px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-weight: 700; text-decoration: none;
    margin-top: 10px; cursor: pointer;
  }
  button.primary { background: var(--main); color: var(--main-ink); border-color: transparent; font-size: 18px; min-height: 64px; }
  a.btn.ig { color: var(--ig); }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.6em; font-size: 15px; color: var(--sub); margin: 8px 2px 0; }
  #status.ok { color: var(--main); font-weight: 700; }
  #status.err { color: #c0392b; }
  ol.steps { margin: 0; padding-left: 1.3em; color: var(--sub); font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="h1">投稿ページ</h1>
  <p class="lead">下の1つ目のボタンを押すだけで、キャプションのコピーと、共有メニューが開きます。</p>

  <section class="card">
    <div id="media" class="media"></div>
    <p id="status" role="status" aria-live="polite">よみこみ中…</p>
  </section>

  <section class="card" id="titleCard" hidden>
    <p class="cap-title">タイトル</p>
    <pre id="title"></pre>
  </section>

  <section class="card" id="capCard" hidden>
    <p class="cap-title">キャプション</p>
    <pre id="caption"></pre>
  </section>

  <button id="shareBtn" class="primary" disabled>① キャプションをコピーして共有</button>
  <button id="copyTitleBtn" hidden>タイトルだけコピー</button>
  <button id="copyBtn" hidden>キャプションだけコピー</button>
  <button id="saveBtn" disabled>動画（画像）を端末に保存</button>
  <a class="btn ig" href="https://www.instagram.com/" id="igLink">アプリを開く</a>

  <section class="card" style="margin-top:16px">
    <ol class="steps">
      <li>①を押す → 共有メニューで投稿するアプリを選ぶ</li>
      <li>投稿画面でキャプション欄を長押し → 「ペースト」</li>
      <li>内容を確認して、投稿する</li>
    </ol>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MIME = { mp4: "video/mp4", m4v: "video/mp4", mov: "video/quicktime", webm: "video/webm",
               png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp" };
  var isLocal = ["localhost", "127.0.0.1"].indexOf(location.hostname) >= 0; // 手元テスト用
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), shareBtn = $("shareBtn"), saveBtn = $("saveBtn"), copyBtn = $("copyBtn");

  function say(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }

  // 取り込める場所は、自分のGitHubのファイルだけ（他人のURLを渡されても読み込まない）
  function allowed(u) {
    try {
      var x = new URL(u);
      if (isLocal) return true;
      return x.protocol === "https:" && x.hostname === "raw.githubusercontent.com" &&
             x.pathname.toLowerCase().indexOf("/rinasannomiya/") === 0;
    } catch (e) { return false; }
  }
  function extOf(u) { var m = /\.([a-z0-9]+)$/i.exec(new URL(u, location.href).pathname); return m ? m[1].toLowerCase() : ""; }
  function nameOf(u) { return decodeURIComponent(new URL(u, location.href).pathname.split("/").pop() || "media"); }

  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ""));
  var urls = q.getAll("v").filter(allowed);
  var caption = h.get("c") || "";
  var title = h.get("t") || "";
  var APPS = { "Instagram": "https://www.instagram.com/", "TikTok": "https://www.tiktok.com/", "YouTube": "https://www.youtube.com/" };
  var app = APPS[h.get("app")] ? h.get("app") : "Instagram";
  $("h1").textContent = app + "に投稿";
  document.title = app + "投稿ページ";
  $("igLink").href = APPS[app]; $("igLink").textContent = app + "アプリを開く";
  if (title) { $("title").textContent = title; $("titleCard").hidden = false; $("copyTitleBtn").hidden = false; }
  var files = [];

  if (!urls.length) { say("投稿する動画／画像が見つかりません。通知からもう一度開いてください。", "err"); return; }

  if (caption) { $("caption").textContent = caption; $("capCard").hidden = false; }
  copyBtn.hidden = !caption;

  // 画面に表示（読み込みは、元のURLを直接指定）
  var mediaEl = $("media");
  urls.forEach(function (u) {
    var isVideo = (MIME[extOf(u)] || "").indexOf("video/") === 0;
    var el = document.createElement(isVideo ? "video" : "img");
    el.src = u;
    if (isVideo) { el.controls = true; el.playsInline = true; el.preload = "metadata"; }
    mediaEl.appendChild(el);
  });

  // 共有用に、ファイルとして先に読み込んでおく（押した瞬間に共有メニューを出すため）
  Promise.all(urls.map(function (u) {
    return fetch(u).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.blob();
    }).then(function (b) {
      var type = MIME[extOf(u)] || b.type || "application/octet-stream";
      return new File([b], nameOf(u), { type: type });
    });
  })).then(function (fs) {
    files = fs;
    shareBtn.disabled = false; saveBtn.disabled = false;
    var canShare = !!(navigator.canShare && navigator.canShare({ files: files }));
    if (!canShare) {
      shareBtn.textContent = "① キャプションをコピー（この端末は共有メニュー非対応）";
      say("準備できました。「動画（画像）を端末に保存」を使ってください。", "ok");
    } else {
      say("準備できました。①を押してください。", "ok");
    }
  }).catch(function (e) {
    say("読み込みに失敗しました（" + e.message + "）。通信を確認して、ページを開き直してください。", "err");
  });

  function copyText(t) {
    if (!t) return Promise.resolve(false);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallbackCopy(t); });
    }
    return Promise.resolve(fallbackCopy(t));
  }
  function fallbackCopy(t) {
    try {
      var ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
      var ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  }

  // ① コピーと共有を、同じ「タップ」の中で始める（iPhoneは、タップの直後でないと共有メニューを出せない）
  shareBtn.addEventListener("click", function () {
    var copied = copyText(caption);               // 待たずに開始
    var canShare = !!(navigator.canShare && navigator.canShare({ files: files }));
    if (!canShare) {
      copied.then(function (ok) { say(ok ? "キャプションをコピーしました。次に、保存ボタンで保存して、Instagramから選んでください。" : "共有に対応していません。保存ボタンを使ってください。", ok ? "ok" : "err"); });
      return;
    }
    navigator.share({ files: files }).then(function () {
      return copied.then(function (ok) { say(ok ? "共有しました。" + app + "の投稿画面で、キャプション欄を長押ししてペーストしてください。" : "共有しました。キャプションは「キャプションだけコピー」で。", "ok"); });
    }).catch(function (e) {
      if (e && e.name === "AbortError") { say("共有をやめました。もう一度①を押せます。"); }
      else { say("共有できませんでした（" + (e && e.name) + "）。保存ボタンから保存してください。", "err"); }
    });
  });

  $("copyTitleBtn").addEventListener("click", function () {
    copyText(title).then(function (ok) { say(ok ? "タイトルをコピーしました。" : "コピーできませんでした。", ok ? "ok" : "err"); });
  });

  copyBtn.addEventListener("click", function () {
    copyText(caption).then(function (ok) { say(ok ? "キャプションをコピーしました。" : "コピーできませんでした。キャプションを長押しして選んでください。", ok ? "ok" : "err"); });
  });

  saveBtn.addEventListener("click", function () {
    files.forEach(function (f, i) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a);
      setTimeout(function () { a.click(); document.body.removeChild(a); }, i * 400);
    });
    say("保存を始めました。端末の「ファイル」や「ダウンロード」に入ります。", "ok");
  });
})();
</script>
</body>
</html>
