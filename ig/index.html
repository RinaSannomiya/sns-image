<!doctype html>
<html lang="ja" data-app="Instagram">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1a3a">
<title>投稿ページ</title>
<script>
// 画面がちらつかないよう、アプリ別のテーマを先に決める
(function(){try{var a=new URLSearchParams(location.hash.slice(1)).get("app");if(a==="TikTok"||a==="YouTube")document.documentElement.setAttribute("data-app",a);}catch(e){}})();
</script>
<style>
  /* アプリごとのテーマ：Instagram=紺×白 / TikTok=白×黒 / YouTube=黒×赤 */
  :root, :root[data-app="Instagram"] {
    --bg: #0e1a3a; --bg2: #16275a; --card: #172859; --ink: #ffffff; --sub: #b4c0e4; --line: #2b3f7c;
    --btn: #ffffff; --btn-ink: #0e1a3a; --accent: #ff7ab6; --accent2: #ffb86b; --ok: #8ff0c0; --err: #ff9b9b;
    --glow: radial-gradient(120% 60% at 50% -10%, #2c4aa8 0%, rgba(14,26,58,0) 70%);
    --stripe: linear-gradient(90deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  }
  :root[data-app="TikTok"] {
    --bg: #ffffff; --bg2: #f3f3f3; --card: #f6f6f7; --ink: #111111; --sub: #5c5c63; --line: #e2e2e6;
    --btn: #111111; --btn-ink: #ffffff; --accent: #fe2c55; --accent2: #25f4ee; --ok: #0a8a5a; --err: #d7263d;
    --glow: radial-gradient(120% 50% at 50% -10%, #e9fffe 0%, rgba(255,255,255,0) 70%);
    --stripe: linear-gradient(90deg, #25f4ee, #25f4ee 45%, #fe2c55 55%, #fe2c55);
  }
  :root[data-app="YouTube"] {
    --bg: #0b0b0b; --bg2: #181818; --card: #1a1a1a; --ink: #ffffff; --sub: #b5b5b5; --line: #303030;
    --btn: #ff0033; --btn-ink: #ffffff; --accent: #ff0033; --accent2: #ff5a5a; --ok: #7ee0a8; --err: #ff8a8a;
    --glow: radial-gradient(120% 50% at 50% -10%, #3a0b12 0%, rgba(11,11,11,0) 70%);
    --stripe: linear-gradient(90deg, #ff0033, #ff0033);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); background: var(--glow), var(--bg); min-height: 100vh;
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 0 max(18px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  body::before { content: ""; display: block; height: 5px; background: var(--stripe); margin: 0 calc(-1 * max(18px, env(safe-area-inset-left))); }
  main { max-width: 560px; margin: 0 auto; padding-top: 22px; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--accent); margin: 0 0 8px;
  }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 6px; letter-spacing: .01em; }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px; margin-bottom: 16px; }
  .media { display: grid; gap: 10px; }
  .media video, .media img { width: 100%; max-height: 64vh; object-fit: contain; border-radius: 16px; background: #000; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .cap-title { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--accent); margin: 2px 0 8px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: inherit; font-size: 16px; }
  button, a.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    min-height: 56px; border-radius: 16px; border: 1.5px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; font-weight: 700; text-decoration: none;
    margin-top: 12px; cursor: pointer; transition: transform .08s ease, opacity .2s;
  }
  button:active, a.btn:active { transform: scale(.98); }
  button.primary {
    background: var(--btn); color: var(--btn-ink); border-color: transparent; font-size: 18px; min-height: 68px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }
  a.btn { color: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; box-shadow: none; }
  #status { min-height: 1.6em; font-size: 15px; color: var(--sub); margin: 10px 4px 2px; }
  #status.ok { color: var(--ok); font-weight: 700; }
  #status.err { color: var(--err); }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; color: var(--sub); font-size: 15px; padding: 6px 0; }
  ol.steps li::before {
    content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 14px; margin-top: 1px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <span class="badge" id="badge">Instagram</span>
  <h1 id="h1">投稿ページ</h1>
  <p class="lead">①を押すだけで、キャプションのコピーと、共有メニューが開きます。</p>

  <section class="card">
    <div id="media" class="media"></div>
    <p id="status" role="status" aria-live="polite">よみこみ中…</p>
  </section>

  <section class="card" id="titleCard" hidden>
    <p class="cap-title">TITLE</p>
    <pre id="title"></pre>
  </section>

  <section class="card" id="capCard" hidden>
    <p class="cap-title">CAPTION</p>
    <pre id="caption"></pre>
  </section>

  <button id="shareBtn" class="primary" disabled>① キャプションをコピーして共有</button>
  <button id="copyTitleBtn" hidden>タイトルだけコピー</button>
  <button id="copyBtn" hidden>キャプションだけコピー</button>
  <button id="saveBtn" disabled>動画（画像）を端末に保存</button>
  <a class="btn" href="https://www.instagram.com/" id="igLink">アプリを開く</a>

  <section class="card" style="margin-top:20px">
    <ol class="steps">
      <li>①を押す → 共有メニューで投稿するアプリを選ぶ</li>
      <li>投稿画面でキャプション欄を長押し → 「ペースト」</li>
      <li>内容を確認して、投稿する</li>
    </ol>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MIME = { mp4: "video/mp4", m4v: "video/mp4", mov: "video/quicktime", webm: "video/webm",
               png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp" };
  var isLocal = ["localhost", "127.0.0.1"].indexOf(location.hostname) >= 0; // 手元テスト用
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), shareBtn = $("shareBtn"), saveBtn = $("saveBtn"), copyBtn = $("copyBtn");

  function say(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }

  // 取り込める場所は、自分のGitHubのファイルだけ（他人のURLを渡されても読み込まない）
  function allowed(u) {
    try {
      var x = new URL(u);
      if (isLocal) return true;
      return x.protocol === "https:" && x.hostname === "raw.githubusercontent.com" &&
             x.pathname.toLowerCase().indexOf("/rinasannomiya/") === 0;
    } catch (e) { return false; }
  }
  function extOf(u) { var m = /\.([a-z0-9]+)$/i.exec(new URL(u, location.href).pathname); return m ? m[1].toLowerCase() : ""; }
  function nameOf(u) { return decodeURIComponent(new URL(u, location.href).pathname.split("/").pop() || "media"); }

  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ""));
  var urls = q.getAll("v").filter(allowed);
  var caption = h.get("c") || "";
  var title = h.get("t") || "";
  var APPS = { "Instagram": "https://www.instagram.com/", "TikTok": "https://www.tiktok.com/", "YouTube": "https://www.youtube.com/" };
  var app = APPS[h.get("app")] ? h.get("app") : "Instagram";
  $("h1").textContent = app + "に投稿"; document.documentElement.setAttribute("data-app", app); $("badge").textContent = app;
  document.title = app + "投稿ページ";
  $("igLink").href = APPS[app]; $("igLink").textContent = app + "アプリを開く";
  if (title) { $("title").textContent = title; $("titleCard").hidden = false; $("copyTitleBtn").hidden = false; }
  var files = [];

  if (!urls.length) { say("投稿する動画／画像が見つかりません。通知からもう一度開いてください。", "err"); return; }

  if (caption) { $("caption").textContent = caption; $("capCard").hidden = false; }
  copyBtn.hidden = !caption;

  // 画面に表示（読み込みは、元のURLを直接指定）
  var mediaEl = $("media");
  urls.forEach(function (u) {
    var isVideo = (MIME[extOf(u)] || "").indexOf("video/") === 0;
    var el = document.createElement(isVideo ? "video" : "img");
    el.src = u;
    if (isVideo) { el.controls = true; el.playsInline = true; el.preload = "metadata"; }
    mediaEl.appendChild(el);
  });

  // 共有用に、ファイルとして先に読み込んでおく（押した瞬間に共有メニューを出すため）
  Promise.all(urls.map(function (u) {
    return fetch(u).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.blob();
    }).then(function (b) {
      var type = MIME[extOf(u)] || b.type || "application/octet-stream";
      return new File([b], nameOf(u), { type: type });
    });
  })).then(function (fs) {
    files = fs;
    shareBtn.disabled = false; saveBtn.disabled = false;
    var canShare = !!(navigator.canShare && navigator.canShare({ files: files }));
    if (!canShare) {
      shareBtn.textContent = "① キャプションをコピー（この端末は共有メニュー非対応）";
      say("準備できました。「動画（画像）を端末に保存」を使ってください。", "ok");
    } else {
      say("準備できました。①を押してください。", "ok");
    }
  }).catch(function (e) {
    say("読み込みに失敗しました（" + e.message + "）。通信を確認して、ページを開き直してください。", "err");
  });

  function copyText(t) {
    if (!t) return Promise.resolve(false);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallbackCopy(t); });
    }
    return Promise.resolve(fallbackCopy(t));
  }
  function fallbackCopy(t) {
    try {
      var ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
      var ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  }

  // ① コピーと共有を、同じ「タップ」の中で始める（iPhoneは、タップの直後でないと共有メニューを出せない）
  shareBtn.addEventListener("click", function () {
    var copied = copyText(caption);               // 待たずに開始
    var canShare = !!(navigator.canShare && navigator.canShare({ files: files }));
    if (!canShare) {
      copied.then(function (ok) { say(ok ? "キャプションをコピーしました。次に、保存ボタンで保存して、Instagramから選んでください。" : "共有に対応していません。保存ボタンを使ってください。", ok ? "ok" : "err"); });
      return;
    }
    navigator.share({ files: files }).then(function () {
      return copied.then(function (ok) { say(ok ? "共有しました。" + app + "の投稿画面で、キャプション欄を長押ししてペーストしてください。" : "共有しました。キャプションは「キャプションだけコピー」で。", "ok"); });
    }).catch(function (e) {
      if (e && e.name === "AbortError") { say("共有をやめました。もう一度①を押せます。"); }
      else { say("共有できませんでした（" + (e && e.name) + "）。保存ボタンから保存してください。", "err"); }
    });
  });

  $("copyTitleBtn").addEventListener("click", function () {
    copyText(title).then(function (ok) { say(ok ? "タイトルをコピーしました。" : "コピーできませんでした。", ok ? "ok" : "err"); });
  });

  copyBtn.addEventListener("click", function () {
    copyText(caption).then(function (ok) { say(ok ? "キャプションをコピーしました。" : "コピーできませんでした。キャプションを長押しして選んでください。", ok ? "ok" : "err"); });
  });

  saveBtn.addEventListener("click", function () {
    files.forEach(function (f, i) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a);
      setTimeout(function () { a.click(); document.body.removeChild(a); }, i * 400);
    });
    say("保存を始めました。端末の「ファイル」や「ダウンロード」に入ります。", "ok");
  });
})();
</script>
</body>
</html>
